services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
      POSTGRES_DB: leave
    ports:
      - "5549:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
